<!-- Paste script này vào browser console để test backend endpoints -->

<script>
    // TEST ALL POSSIBLE NOTIFICATION ENDPOINTS
    (async function testAllEndpoints() {
        console.clear();
        console.log('🔍 Testing all possible notification endpoints...\n');

        const token = localStorage.getItem('token');
        if (!token) {
            console.error('❌ No token! Please login first.');
            return;
        }

        const baseUrl = 'http://localhost:8080';
        const endpoints = [
            '/api/notifications',
            '/api/notifications/my',
            '/api/notification',
            '/api/notification/my',
            '/notifications',
            '/notifications/my',
            '/notification',
            '/notification/my',
            '/api/user/notifications',
            '/api/v1/notifications',
            '/api/early-checkin/notifications',
        ];

        const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
        };

        console.log(
            'Testing endpoints with token:',
            token.substring(0, 20) + '...\n',
        );

        for (const endpoint of endpoints) {
            try {
                const response = await fetch(`${baseUrl}${endpoint}`, {
                    headers,
                });
                const status = response.status;

                if (status === 200) {
                    const data = await response.json();
                    console.log(`✅ ${endpoint}`);
                    console.log('   Status:', status);
                    console.log('   Data:', data);
                    console.log('');
                } else if (status === 401) {
                    console.log(
                        `🔒 ${endpoint} - 401 Unauthorized (need valid token)`,
                    );
                } else if (status === 403) {
                    console.log(
                        `🚫 ${endpoint} - 403 Forbidden (no permission)`,
                    );
                } else {
                    console.log(`❌ ${endpoint} - ${status}`);
                }
            } catch (error) {
                console.log(`💥 ${endpoint} - Error:`, error.message);
            }
        }

        console.log('\n📊 Summary:');
        console.log("If you see ✅, that's the correct endpoint!");
        console.log(
            'If all are ❌, backend might not be running or notification feature not implemented yet.',
        );
    })();
</script>
